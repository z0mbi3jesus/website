<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Independent Systems</title>
	<style>
		:root {
			color-scheme: dark;
			--background: #17191b;
			--sidebar: #202326;
			--button: #3a3e42;
			--button-hover: #4a4f54;
			--text: #e1e2df;
			--muted: #969b9d;
			--border: #555a5d;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: Georgia, 'Times New Roman', serif;
		}

		.page {
			display: grid;
			grid-template-columns: 15rem minmax(0, 1fr);
			min-height: 100vh;
		}

		.sidebar {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 2rem 1.5rem;
			background: var(--sidebar);
		}

		.mark {
			color: var(--muted);
			font-family: 'Courier New', monospace;
			font-size: 0.75rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.navigation {
			display: grid;
			gap: 0.55rem;
			margin-top: 4rem;
		}

		.navigation a {
			display: block;
			padding: 0.75rem 0.85rem;
			border: 1px solid transparent;
			color: var(--text);
			background: var(--button);
			font-family: 'Courier New', monospace;
			font-size: 0.8rem;
			text-decoration: none;
			transition: background 160ms ease, border-color 160ms ease;
		}

		.navigation a:hover,
		.navigation a:focus-visible {
			border-color: var(--muted);
			background: var(--button-hover);
			outline: none;
		}

		.sidebar-footer {
			color: var(--muted);
			font-family: 'Courier New', monospace;
			font-size: 0.7rem;
			line-height: 1.5;
		}

		.contact {
			position: relative;
			isolation: isolate;
			display: flex;
			align-items: center;
			min-height: 100vh;
			overflow: hidden;
			padding: clamp(2rem, 8vw, 7rem);
			background: #292c2d;
		}

		.contact::before {
			position: absolute;
			z-index: -2;
			inset: 0;
			background: url('media/6thlevellogo.png') center / cover no-repeat;
			content: '';
			filter: grayscale(0.65) contrast(1.08);
			opacity: 0.78;
		}

		.contact::after {
			position: absolute;
			z-index: -1;
			inset: 0;
			background: linear-gradient(180deg, rgba(10, 11, 12, 0.28), rgba(10, 11, 12, 0.88));
			content: '';
		}

		.contact-content {
			position: relative;
			z-index: 1;
			width: min(100%, 38rem);
		}

		.eyebrow {
			margin: 0 0 1rem;
			color: var(--muted);
			font-family: 'Courier New', monospace;
			font-size: 0.75rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0 0 1rem;
			font-size: clamp(2.5rem, 6vw, 5rem);
			font-weight: normal;
			line-height: 0.95;
		}

		.intro {
			max-width: 30rem;
			margin: 0 0 2.5rem;
			color: var(--muted);
			font-size: 1.1rem;
			line-height: 1.6;
		}

		.contact-form {
			display: grid;
			gap: 1.25rem;
		}

		label {
			display: grid;
			gap: 0.5rem;
			color: var(--muted);
			font-family: 'Courier New', monospace;
			font-size: 0.75rem;
			text-transform: uppercase;
		}

		input,
		textarea {
			width: 100%;
			border: 1px solid var(--border);
			border-radius: 0;
			padding: 0.8rem;
			color: var(--text);
			background: #1d2022;
			font: inherit;
		}

		input:focus,
		textarea:focus {
			border-color: var(--text);
			outline: none;
		}

		textarea {
			min-height: 9rem;
			resize: vertical;
		}

		button {
			width: fit-content;
			border: 1px solid var(--border);
			padding: 0.8rem 1rem;
			color: var(--text);
			background: var(--button);
			cursor: pointer;
			font-family: 'Courier New', monospace;
			font-size: 0.8rem;
			transition: background 160ms ease, border-color 160ms ease;
		}

		button:hover,
		button:focus-visible {
			border-color: var(--muted);
			background: var(--button-hover);
			outline: none;
		}

		.form-note {
			margin: 0;
			color: var(--muted);
			font-family: 'Courier New', monospace;
			font-size: 0.7rem;
			line-height: 1.5;
		}

		@media (max-width: 680px) {
			.page {
				display: block;
			}

			.sidebar {
				min-height: auto;
				padding: 1.25rem;
			}

			.navigation {
				grid-template-columns: repeat(4, 1fr);
				margin-top: 2rem;
			}

			.sidebar-footer {
				display: none;
			}

			.contact {
				min-height: calc(100vh - 9.75rem);
				padding: 3rem 1.25rem;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<aside class="sidebar">
			<div>
				<div class="mark">Independent systems</div>
				<nav class="navigation" aria-label="Main navigation">
					<a href="index.html">Home</a>
					<a href="index.html#coming-soon">Coming Soon</a>
					<a href="index.html#about">About</a>
					<a href="contact.html" aria-current="page">Contact</a>
				</nav>
			</div>
			<div class="sidebar-footer">A place for work<br>in progress.</div>
		</aside>

		<section class="contact" aria-labelledby="contact-title">
			<div class="contact-content">
				<p class="eyebrow">Get in touch</p>
				<h1 id="contact-title">Contact</h1>
				<p class="intro">Have a problem worth exploring, or want to talk about a project? Send a note below.</p>

				<form class="contact-form" id="contact-form">
					<label>
						Name
						<input type="text" name="name" autocomplete="name" required>
					</label>
					<label>
						Email
						<input type="email" name="email" autocomplete="email" required>
					</label>
					<label>
						Message
						<textarea name="message" required></textarea>
					</label>
					<button type="submit">Send message</button>
					<p class="form-note" id="form-status" role="status"></p>
				</form>
			</div>
		</section>
	</main>
	<script>
		const SUPABASE_FUNCTION_URL =
			'https://bphstvtuopcvtxaiqhpu.supabase.co/functions/v1/send-contact-email';
		const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwaHN0dnR1b3BjdnR4YWlxaHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzAzOTQsImV4cCI6MjEwNTYwNjM5NH0.toT5L5hNpAudL23SgUacB8afuZRnQYeHps8FNauraR4';
		const form = document.querySelector('#contact-form');
		const status = document.querySelector('#form-status');
		const submitButton = form.querySelector('button[type="submit"]');

		form.addEventListener('submit', async function (event) {
			event.preventDefault();
			status.textContent = '';
			submitButton.disabled = true;
			submitButton.textContent = 'Sending...';

			if (!SUPABASE_FUNCTION_URL) {
				status.textContent = 'The contact service is not configured yet.';
				submitButton.disabled = false;
				submitButton.textContent = 'Send message';
				return;
			}

			try {
				const response = await fetch(SUPABASE_FUNCTION_URL, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						apikey: SUPABASE_ANON_KEY,
						Authorization: `Bearer ${SUPABASE_ANON_KEY}`
					},
					body: JSON.stringify(Object.fromEntries(new FormData(form)))
				});

				if (!response.ok) {
					throw new Error('The contact service returned an error.');
				}

				form.reset();
				status.textContent = 'Message sent. Thank you.';
			} catch (error) {
				console.error(error);
				status.textContent = 'Unable to send the message right now. Please try again.';
			} finally {
				submitButton.disabled = false;
				submitButton.textContent = 'Send message';
			}
		});
	</script>
</body>
</html>
